version: '3'

vars:
  PROJECT: XStats.xcodeproj
  SCHEME: XStats
  CONFIG: '{{default "Release" .CONFIG}}'
  DERIVED: build/DerivedData-arm64
  APP: '{{.DERIVED}}/Build/Products/{{.CONFIG}}/XStats.app'
  NETWORK_DERIVED: build/DerivedData-network-arm64
  NETWORK_APP: '{{.NETWORK_DERIVED}}/Build/Products/{{.CONFIG}}/XStats Network Monitor.app'
  BUMP: '{{default "1" .BUMP}}'
  INSTALL: '{{default "1" .INSTALL}}'
  SIGN_ID:
    sh: |
      if [ -n "${SIGN_ID:-}" ]; then
        printf '%s\n' "$SIGN_ID"
      else
        security find-identity -v -p codesigning 2>/dev/null | awk '/Developer ID Application/ { print $2; exit }' || true
      fi
  TEAM_ID:
    sh: |
      if [ -n '{{.SIGN_ID}}' ]; then
        security find-identity -v -p codesigning 2>/dev/null \
          | grep -F '{{.SIGN_ID}}' | head -1 | sed -nE 's/.*\(([A-Z0-9]+)\)"$/\1/p' || true
      fi

tasks:
  generate:
    desc: 由 project.yml 生成 Xcode 工程
    cmds:
      - xcodegen generate --quiet

  build:
    desc: 编译 App（含辅助工具）并安装
    cmds:
      - |
        if [ "{{.INSTALL}}" != "0" ] && pgrep -x XStatsWidget >/dev/null; then
          pkill -x XStatsWidget 2>/dev/null || true
          for _ in $(seq 1 25); do pgrep -x XStatsWidget >/dev/null || break; sleep 0.2; done
          if pgrep -x XStatsWidget >/dev/null; then
            echo "error: XStatsWidget 尚未退出，无法安全构建安装" >&2
            exit 1
          fi
        fi
      - |
        if [ "{{.BUMP}}" != "0" ]; then ./scripts/version.sh build; fi
      - task: compile
        vars:
          CONFIG: '{{.CONFIG}}'
          SIGN_ID: '{{.SIGN_ID}}'
      - |
        if [ "{{.INSTALL}}" != "0" ]; then ./scripts/install_local.sh "{{.APP}}"; fi

  compile:
    desc: 只编译 App，不安装
    deps: [generate]
    cmds:
      - |
        # Xcode 增量构建不会自动移除旧目标留下的扩展目录；主包只保留 Widget。
        rm -rf "{{.APP}}/Contents/Library/SystemExtensions"
        xcodebuild -project "{{.PROJECT}}" -scheme "{{.SCHEME}}" -configuration "{{.CONFIG}}" \
          -derivedDataPath "{{.DERIVED}}" \
          -destination 'generic/platform=macOS' ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
          XSTATS_APP_PROFILE="${XSTATS_APP_PROFILE:-}" XSTATS_WIDGET_PROFILE="${XSTATS_WIDGET_PROFILE:-}" \
          {{if .TEAM_ID}}CODE_SIGN_IDENTITY="{{.SIGN_ID}}" CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM={{.TEAM_ID}}{{if eq .CONFIG "Release"}} OTHER_CODE_SIGN_FLAGS=--timestamp CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO{{end}}{{else}}CODE_SIGNING_ALLOWED=NO ENABLE_HARDENED_RUNTIME=NO{{end}} \
          build
      - bash scripts/sign_sparkle.sh "{{.APP}}" "{{.SIGN_ID}}"

  build-network-component:
    desc: 编译并签名独立网络组件与按需 LaunchAgent，不推进版本或安装
    cmds:
      - task: compile-network-component
        vars:
          CONFIG: '{{.CONFIG}}'
          SIGN_ID: '{{.SIGN_ID}}'

  compile-network-component:
    desc: 只编译并签名 XStats Network Monitor（macOS 15+、arm64）
    deps: [generate]
    cmds:
      - |
        xcodebuild -project "{{.PROJECT}}" -scheme XStatsNetworkMonitor -configuration "{{.CONFIG}}" \
          -derivedDataPath "{{.NETWORK_DERIVED}}" \
          -destination 'generic/platform=macOS' ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
          XSTATS_COMPONENT_PROFILE="${XSTATS_COMPONENT_PROFILE:-}" XSTATS_NETWORK_PROFILE="${XSTATS_NETWORK_PROFILE:-}" \
          {{if .TEAM_ID}}CODE_SIGN_IDENTITY="{{.SIGN_ID}}" CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM={{.TEAM_ID}}{{if eq .CONFIG "Release"}} OTHER_CODE_SIGN_FLAGS=--timestamp CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO{{end}}{{else}}CODE_SIGNING_ALLOWED=NO ENABLE_HARDENED_RUNTIME=NO{{end}} \
          build
      - bash scripts/sign_sparkle.sh "{{.NETWORK_APP}}" "{{.SIGN_ID}}" network-component

  test-network-component:
    desc: 定向验证网络组件 LaunchAgent 与服务生命周期，不注册或安装
    cmds:
      - bash scripts/embed_network_agent_test.sh
      - bash scripts/network_component_lifetime_test.sh

  release-network-component:
    desc: 签名、公证并打包独立网络组件，不上传
    cmds:
      - ./scripts/release_network_component.sh {{.CLI_ARGS}}

  run:
    desc: 编译、安装并启动 App
    deps: [build]

  install:
    desc: 编译、安装并启动 App
    deps: [build]

  release:
    desc: 签名、公证、装订、打包 DMG 并生成 Homebrew cask
    cmds:
      - ./scripts/release.sh

  publish:
    desc: 发布已构建且已提交推送的制品
    cmds:
      - ./scripts/publish_release.sh

  release-all:
    desc: 测试、构建、公证、提交推送并完成全部发布
    cmds:
      - ./scripts/release_all.sh

  stop:
    desc: 停止正在运行的 App
    cmds:
      - pkill -x XStats
    ignore_error: true

  test:
    desc: 运行版本脚本、API 和 Swift 单元测试
    cmds:
      - bash scripts/version_test.sh
      - bash scripts/arm64_release_test.sh
      - bash scripts/release_all_test.sh
      - bash scripts/publish_release_test.sh
      - python3 scripts/release_provenance_test.py
      - python3 scripts/publish_api_test.py
      - python3 scripts/sync_changelog_test.py
      - python3 scripts/sparkle_appcast_test.py
      - python3 scripts/github_release_notes_test.py
      - python3 scripts/network_geography_test.py
      - bash scripts/release_network_component_test.sh
      - task: test-network-component
      - task: test-api
      - task: test-swift

  test-api:
    internal: true
    dir: server/api
    cmds:
      - go test ./...

  test-swift:
    internal: true
    dir: Packages/XStatsKit
    cmds:
      - swift build --build-tests
      # 较旧 Swift 工具链把全部模块放在一个测试进程，阻塞型夹具会拖延其他模块的取消与超时。
      # 按 Package.swift 中的测试目标隔离运行，保留模块内并发及全部断言，与新工具链行为一致。
      - |
        set -euo pipefail
        modules="$(swift package describe --type json | python3 -c 'import json, sys; print("\n".join(t["name"] for t in json.load(sys.stdin)["targets"] if t["type"] == "test"))')"
        test -n "$modules"
        while IFS= read -r module; do
          swift test --skip-build --filter "^${module}\."
        done <<< "$modules"

  snapshot:
    desc: 使用当前构建截图；-- 后可传截图模式与语言
    vars:
      SNAPSHOT_APP: '{{default .APP .SNAPSHOT_APP}}'
      SNAPSHOT_DIR: '{{default "build/snapshots" .SNAPSHOT_DIR}}'
    preconditions:
      - sh: 'test -x "{{.SNAPSHOT_APP}}/Contents/MacOS/XStats"'
        msg: '先运行 task build BUMP=0 INSTALL=0，或用 SNAPSHOT_APP 指定已有构建'
    cmds:
      - '"{{.SNAPSHOT_APP}}/Contents/MacOS/XStats" --snapshot "{{.SNAPSHOT_DIR}}" {{.CLI_ARGS}}'

  open:
    desc: 生成工程并用 Xcode 打开
    deps: [generate]
    cmds:
      - open "{{.PROJECT}}"

  clean:
    desc: 删除构建产物
    cmds:
      - rm -rf build

  version:
    desc: 显示当前版本
    cmds:
      - ./scripts/version.sh
