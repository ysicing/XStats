name: XStats

options:
  bundleIdPrefix: work.12306.xstats
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: zh-Hans
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    # 公开版本号是标准 semver，真源是 CHANGELOG.md 顶部的 “## X.Y.Z · YYYY-MM-DD”
    MARKETING_VERSION: "1.1.0"
    # Apple 内部构建号每次 task build 加一，独立于公开版本号且不重置
    CURRENT_PROJECT_VERSION: "142"
    # 独立网络组件及扩展共用版本；只在组件、扩展或共享协议变化时推进。
    NETWORK_EXTENSION_VERSION: "1.0.1"
    NETWORK_EXTENSION_BUILD: "141"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    # 本地开发使用 ad-hoc 签名；正式发布使用 Developer ID（见 docs/DEVELOPMENT.md）
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  XStatsKit:
    path: Packages/XStatsKit

targets:
  XStats:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: LICENSES/Sparkle-License.txt
        buildPhase: resources
      - path: Helper/work.12306.xstats.helper.plist
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchDaemons
    info:
      path: App/Info.plist
      properties:
        CFBundleName: XStats
        CFBundleDisplayName: XStats
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleLocalizations: [zh-Hans, zh-Hant, ja, ko, en, de, es, fr, ar]
        CFBundleURLTypes:
          - CFBundleURLName: work.12306.xstats.app
            CFBundleTypeRole: Viewer
            CFBundleURLSchemes: [xstats]
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSUIElement: true
        NetworkComponentVersion: $(NETWORK_EXTENSION_VERSION)
        SUPublicEDKey: "j/I8zd8BXz4oPldnhocEySXTMmXPxKMyBRwoA4ewLIk="
        SUEnableAutomaticChecks: false
        SUAutomaticallyUpdate: false
        SUEnableSystemProfiling: false
        SURequireSignedFeed: true
        SUVerifyUpdateBeforeExtraction: true
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: © 2026 XStats
        NSAudioCaptureUsageDescription: 在本机实时调节应用音量，不录制、保存或上传声音。
        NSBluetoothAlwaysUsageDescription: 显示已配对的蓝牙音频设备，并在您选择时连接设备。
        NSCalendarsFullAccessUsageDescription: 在本机日历面板显示您选择的系统日程，不修改或上传日程内容。
        NSRemindersFullAccessUsageDescription: 在本机日历面板显示您选择的到期提醒，不修改或上传提醒内容。
    entitlements:
      path: App/XStats.entitlements
      properties:
        # EventKit 在 Hardened Runtime 下请求日历与提醒事项访问所需；仍由用户单独授权。
        com.apple.security.personal-information.calendars: true
        com.apple.security.application-groups:
          - group.work.12306.xstats
          - $(TeamIdentifierPrefix)work.12306.xstats.network-observation
    settings:
      base:
        PRODUCT_NAME: XStats
        PRODUCT_BUNDLE_IDENTIFIER: work.12306.xstats.app
        PROVISIONING_PROFILE_SPECIFIER: $(XSTATS_APP_PROFILE)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: XStatsKit
        product: XStatsUI
      - target: XStatsHelper
        embed: true
        copy:
          destination: executables
      - target: XStatsWidget
        embed: true

  XStatsNetworkMonitor:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: NetworkMonitorApp
        excludes: ["*.plist", "*.entitlements"]
      - path: App/Assets.xcassets
        buildPhase: resources
      - path: LICENSES/Sparkle-License.txt
        buildPhase: resources
    info:
      path: NetworkMonitorApp/Info.plist
      properties:
        CFBundleName: XStats Network Monitor
        CFBundleDisplayName: XStats Network Monitor
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleLocalizations: [zh-Hans, zh-Hant, ja, ko, en, de, es, fr, ar]
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSUIElement: true
        SUPublicEDKey: "j/I8zd8BXz4oPldnhocEySXTMmXPxKMyBRwoA4ewLIk="
        SUFeedURL: https://apps.12306.work/api/v1/apps/xstats-network-monitor/update/appcast.xml
        SUEnableAutomaticChecks: false
        SUAutomaticallyUpdate: false
        SUEnableSystemProfiling: false
        SURequireSignedFeed: true
        SUVerifyUpdateBeforeExtraction: true
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: © 2026 XStats
        NSSystemExtensionUsageDescription: 只在本机查看应用的网络连接，不阻断连接或读取通信内容。
        NetworkObservationExtensionVersion: $(NETWORK_EXTENSION_VERSION)
        NetworkObservationExtensionBuild: $(NETWORK_EXTENSION_BUILD)
        NetworkObservationMachService: $(TeamIdentifierPrefix)work.12306.xstats.network-observation.ipc.$(NETWORK_EXTENSION_BUILD)
        NetworkObservationProtocolVersion: 2
        NetworkObservationControlMachService: $(TeamIdentifierPrefix)work.12306.xstats.network-observation.control
    entitlements:
      path: NetworkMonitorApp/XStatsNetworkMonitor.entitlements
      properties:
        com.apple.developer.system-extension.install: true
        com.apple.developer.networking.networkextension:
          - content-filter-provider-systemextension
        com.apple.security.application-groups:
          - $(TeamIdentifierPrefix)work.12306.xstats.network-observation
    settings:
      base:
        MARKETING_VERSION: $(NETWORK_EXTENSION_VERSION)
        CURRENT_PROJECT_VERSION: $(NETWORK_EXTENSION_BUILD)
        PRODUCT_NAME: XStats Network Monitor
        PRODUCT_MODULE_NAME: XStatsNetworkMonitor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: work.12306.xstats.networkmonitor
        PROVISIONING_PROFILE_SPECIFIER: $(XSTATS_COMPONENT_PROFILE)
    postBuildScripts:
      - name: Embed on-demand network LaunchAgent
        script: bash "$SRCROOT/scripts/embed_network_agent.sh" "$TARGET_BUILD_DIR/$WRAPPER_NAME"
        inputFiles:
          - $(SRCROOT)/scripts/embed_network_agent.sh
          - $(TARGET_BUILD_DIR)/$(WRAPPER_NAME)/Contents/Info.plist
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(WRAPPER_NAME)/Contents/Library/LaunchAgents/work.12306.xstats.networkmonitor.agent.plist
    dependencies:
      - package: XStatsKit
        product: NetworkObservation
      - package: XStatsKit
        product: Updates
      - package: XStatsKit
        product: Localization
      - target: XStatsNetworkExtension
        embed: true

  XStatsNetworkExtension:
    type: system-extension
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: NetworkExtension
        excludes: ["*.plist", "*.entitlements"]
    info:
      path: NetworkExtension/Info.plist
      properties:
        CFBundleDisplayName: XStats Network Extension
        CFBundlePackageType: SYSX
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSSystemExtensionUsageDescription: 只在本机查看应用的网络连接，不阻断连接或读取通信内容。
        NetworkExtension:
          NEMachServiceName: $(TeamIdentifierPrefix)work.12306.xstats.network-observation.ipc.$(NETWORK_EXTENSION_BUILD)
          NEProviderClasses:
            com.apple.networkextension.filter-data: $(PRODUCT_MODULE_NAME).ConnectionFilterProvider
    entitlements:
      path: NetworkExtension/XStatsNetworkExtension.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - $(TeamIdentifierPrefix)work.12306.xstats.network-observation
        com.apple.developer.networking.networkextension:
          - content-filter-provider-systemextension
    settings:
      base:
        # sysextd 按 Bundle ID 对应的文件名查找嵌入的系统扩展。
        MARKETING_VERSION: $(NETWORK_EXTENSION_VERSION)
        CURRENT_PROJECT_VERSION: $(NETWORK_EXTENSION_BUILD)
        PRODUCT_NAME: work.12306.xstats.app.networkextension
        PRODUCT_MODULE_NAME: XStatsNetworkExtension
        PRODUCT_BUNDLE_IDENTIFIER: work.12306.xstats.app.networkextension
        PROVISIONING_PROFILE_SPECIFIER: $(XSTATS_NETWORK_PROFILE)
        SKIP_INSTALL: YES
    dependencies:
      - package: XStatsKit
        product: NetworkObservation

  # 桌面小组件（沙盒扩展），嵌入 XStats.app/Contents/PlugIns
  XStatsWidget:
    type: app-extension
    platform: macOS
    sources:
      - path: Widget
        excludes:
          - "*.entitlements"
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: XStats
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/XStatsWidget.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - group.work.12306.xstats
    settings:
      base:
        PRODUCT_NAME: XStatsWidget
        PRODUCT_BUNDLE_IDENTIFIER: work.12306.xstats.app.widget
        PROVISIONING_PROFILE_SPECIFIER: $(XSTATS_WIDGET_PROFILE)
        SKIP_INSTALL: YES
    dependencies:
      - package: XStatsKit
        product: Metrics
      - package: XStatsKit
        product: WidgetData
      - package: XStatsKit
        product: Localization

  XStatsHelper:
    type: tool
    platform: macOS
    sources:
      - path: Helper
        excludes:
          - "*.plist"
    settings:
      base:
        PRODUCT_NAME: XStatsHelper
        PRODUCT_BUNDLE_IDENTIFIER: work.12306.xstats.helper
        GENERATE_INFOPLIST_FILE: YES
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        SKIP_INSTALL: YES
    dependencies:
      - package: XStatsKit
        product: SMC
      - package: XStatsKit
        product: HelperShared

schemes:
  XStatsNetworkMonitor:
    build:
      targets:
        XStatsNetworkMonitor: all
